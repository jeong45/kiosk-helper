
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>키우미 - 마트 EASY 미션</title>

  <!-- Pretendard -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <!-- 기존 마트 디자인 -->
  <link rel="stylesheet" href="../../menu&cart/mart.css">

  <!-- EASY 미션 전용 디자인 -->
  <link rel="stylesheet" href="easy.css">
</head>

<body>

  <div class="kiosk-container">

    <main class="page-content">

      <!-- 상단 헤더 -->
      <header class="top-header">

        <div class="logo-area">

          <div class="logo-icon-img">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <rect width="24" height="24" rx="6" fill="#DCFCE7"/>
              <path d="M12 5V15M12 15C10 13 7 13 5 15M12 15C14 13 17 13 19 15"
                stroke="#166534" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>

          <span class="logo-text">키우미</span>

        </div>

        <div class="store-badge-bar">

          <div class="store-title-box">
            <div class="store-red-icon">🏪</div>
            <span class="store-main-title">마트·편의점 키오스크</span>
          </div>

          <button type="button" class="top-cart-badge"
            id="topCartBadge" onclick="goToCart()">
            장바구니 0
          </button>

        </div>

      </header>


      <!-- EASY 미션 안내창 -->
      <section class="easy-mission-banner">

        <div class="easy-mission-header">

          <span class="easy-mission-level">EASY</span>

          <span class="easy-mission-label">오늘의 미션</span>

        </div>

        <p class="easy-mission-instruction" id="missionInstruction">
          미션을 불러오는 중입니다.
        </p>

      </section>


      <!-- 바코드 스캔 안내 -->
      <section class="scan-banner">

        <h2 class="scan-title">
          상품의 바코드를 스캔해 주세요.
        </h2>

        <p class="scan-sub">
          쇼핑 봉투가 필요하시면 진열대에서 미리 챙겨주세요.
        </p>

        <div class="scanner-graphic-box">

          <div class="scanner-canvas">

            <div class="barcode-target" id="barcodeTarget">
              <div class="corner tl"></div>
              <div class="corner tr"></div>
              <div class="corner bl"></div>
              <div class="corner br"></div>
              <div class="barcode-lines"></div>
            </div>

            <div class="scan-beam" id="scanBeam"></div>

            <div class="scanner-gun">
              <div class="gun-head"></div>
              <div class="gun-handle"></div>
            </div>

          </div>

        </div>

      </section>


      <!-- 상품 카테고리 -->
      <nav class="category-tabs">

        <button type="button" class="tab-btn active"
          data-category="추천상품">
          추천상품
        </button>

        <button type="button" class="tab-btn"
          data-category="음료">
          음료
        </button>

        <button type="button" class="tab-btn"
          data-category="간편식">
          간편식
        </button>

        <button type="button" class="tab-btn"
          data-category="과자">
          과자
        </button>

        <button type="button" class="tab-btn"
          data-category="생활용품">
          생활용품
        </button>

      </nav>


      <!-- 상품 목록 -->
      <section class="product-section">

        <p class="section-guide-text">
          상품을 누르면 바코드가 스캔됩니다
        </p>

        <h3 class="section-title">셀프 계산</h3>

        <div class="product-grid" id="productGrid">
          <!-- JavaScript에서 상품 카드 생성 -->
        </div>

      </section>

    </main>


    <!-- 하단 장바구니 -->
    <div class="bottom-cart-bar" id="bottomCartBar"
      onclick="goToCart()">
      장바구니가 비어있습니다
    </div>


    <!-- 상품 수량 조절 모달 -->
    <div class="modal-overlay" id="optionModal"
      style="display: none;">

      <div class="modal-card">

        <button type="button" class="modal-close-btn"
          onclick="closeModal()">✕</button>

        <div class="modal-sub-label">상품 선택</div>

        <h3 class="modal-item-title" id="modalItemTitle">
          생수
        </h3>

        <div class="modal-item-price" id="modalItemPrice">
          1,000원
        </div>

        <div class="modal-quantity-box">

          <span class="quantity-label">수량</span>

          <div class="quantity-controls">

            <button type="button" class="qty-btn"
              onclick="changeQuantity(-1)">
              -
            </button>

            <span id="modalQuantity">1</span>

            <button type="button" class="qty-btn"
              onclick="changeQuantity(1)">
              +
            </button>

          </div>

        </div>

        <button type="button" class="btn-primary full"
          id="modalAddButton" onclick="addToCart()">

          장바구니 담기 ·
          <span id="modalBtnPrice">1,000원</span>

        </button>

      </div>

    </div>

  </div>


  <!-- JavaScript 연결 -->

  <!-- 기존 마트 상품 및 장바구니 기능 -->
  <script src="../../menu&cart/mart.js"></script>

  <!-- EASY 미션 전용 기능 -->
  <script src="easy.js"></script>

</body>
</html>

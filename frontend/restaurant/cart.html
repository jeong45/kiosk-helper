
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>키우미 - 장바구니</title>
  <link rel="stylesheet" href="restaurant.css">
</head>
<body>

  <!-- 장바구니 화면 -->
  <div class="kiosk-container" id="cartStep">
    <header class="kiosk-header">
      <div class="header-left">
        <div class="brand-icon">🍴</div>
        <span class="brand-title">T-order</span>
      </div>
      <div class="cart-badge-top" id="cartBadgeTop">장바구니 1</div>
    </header>

    <main class="page-content">
      <div class="top-nav-row">
        <div>
          <div class="sub-label">선택한 상품</div>
          <h2 class="page-title">장바구니</h2>
        </div>
        <button class="more-btn" onclick="goToMenu()">메뉴 더 담기</button>
      </div>

      <!-- 장바구니 목록 -->
      <div class="cart-list" id="cartList"></div>

      <!-- 하단 고정 영역 -->
      <div class="bottom-fixed-box">
        <div class="total-row">
          <span>총 <span id="cartTotalCount">1</span>개 상품</span>
          <span class="total-price" id="cartTotalPrice">12,000원</span>
        </div>

        <div class="btn-group-two">
          <button class="btn-secondary" onclick="goToMenu()">더 담기</button>
          <button
            class="btn-primary"
            id="tutorialOrderConfirm"
            onclick="showOrderConfirm()"
          >
            주문 확인
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- 주문 확인 화면 -->
  <div class="kiosk-container" id="confirmStep" style="display: none;">
    <header class="kiosk-header">
      <div class="header-left">
        <div class="brand-icon">🍴</div>
        <span class="brand-title">T-order</span>
      </div>
      <div class="cart-badge-top">장바구니 1</div>
    </header>

    <main class="page-content">
      <div class="sub-label">결제 전 확인</div>
      <h2 class="page-title">주문 확인</h2>

      <div class="confirm-list" id="confirmList"></div>

      <div class="bottom-fixed-box">
        <div class="total-row">
          <span>총 <span id="confirmTotalCount">1</span>개 상품</span>
          <span class="total-price" id="confirmTotalPrice">12,000원</span>
        </div>

        <div class="btn-group-two">
          <button class="btn-secondary" onclick="showCartStep()">이전</button>
          <button
            class="btn-primary"
            id="tutorialPaymentButton"
            onclick="goToPayment()"
          >
            결제하기
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="restaurant.js"></script>
  <script src="tutorial.js"></script>

</body>
</html>


<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미션 난이도 선택</title>
    <link rel="stylesheet" href="mission-common.css">
</head>
<body>
    <div class="mobile-container">
        <header class="header">
            <button class="back-btn" id="backBtn" aria-label="뒤로 가기">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <h1 class="header-title">미션 난이도 선택</h1>
        </header>

        <main class="content">
            <div class="category-icon-wrapper">
                <div class="category-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"></path>
                        <path d="M15 2v10"></path>
                        <path d="M12 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"></path>
                        <path d="M6 2v10"></path>
                        <path d="M6 14v8"></path>
                        <path d="M18 14v8"></path>
                    </svg>
                </div>
            </div>

            <section class="title-section">
                <h2>어떤 미션에 도전할까요?</h2>
                <p>나에게 맞는 난이도를 선택해 주세요.</p>
            </section>

            <div class="mission-cards">
                <div class="mission-card easy" data-level="easy">
                    <span class="badge easy-badge">EASY</span>
                    <div class="card-text">
                        <h3>기본 주문 연습</h3>
                        <p>메뉴와 수량을 확인하고 지정된 방식으로 결제해요.</p>
                    </div>
                </div>

                <div class="mission-card hard" data-level="hard">
                    <span class="badge hard-badge">HARD</span>
                    <div class="card-text">
                        <h3>복합 주문 연습</h3>
                        <p>추가 상품과 옵션을 확인하고 지정된 결제 조건까지 수행해요.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="mission-common.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>햄버거 키오스크 연습</title>
    <!-- 폰트 적용 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
        }
        
        /* 모바일 디바이스 프레임 */
        #device-frame {
            width: 375px;
            height: 812px;
            background-color: #ffffff;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 12px solid #1f2937;
            position: relative;
            overflow: hidden;
        }

        /* 화면 공통 스타일 */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #ffffff;
            z-index: 10;
        }
        
        /* 활성화된 화면만 보이기 */
        .screen.active {
            display: flex;
            animation: fadeIn 0.3s ease-in-out;
        }

        /*하단 모달탭*/
        .overlay {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 50;
        }
        .overlay.active {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>

    <div id="device-frame">
        <!-- 1. 메인 화면 (screen-main) -->
        <div id="screen-main" class="screen active bg-white">
            <div class="p-6 h-full flex flex-col">
                <!-- Header -->
                <div class="flex items-center gap-2 mb-8 mt-4">
                    <img src="images/mainLogo.png" alt="메인 로고" class="w-8 h-8 object-contain" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxyZWN0IHg9IjMiIHk9IjMiIHdpZHRoPSIxOCIgaGVpZ2h0PSIxOCIgcng9IjIiIHJ5PSIyIjwvcmVjdD48Y2lyY2xlIGN4PSI4LjUiIGN5PSI4LjUiIHI9IjEuNSI+PC9jaXJjbGU+PHBvbHlsaW5lIHBvaW50cz0iMjEgMTUgMTYgMTAgNSAyMSI+PC9wb2x5bGluZT48L3N2Zz4='">
                    <span class="font-extrabold text-lg text-gray-800">키우미</span>
                </div>
                <!-- Title -->
                <h2 class="text-[26px] font-black mb-3 leading-snug text-gray-900">오늘은 어떤 키오스크를<br>연습해 볼까요?</h2>
                <p class="text-sm text-gray-500 mb-8">연습하고 싶은 장소를 하나 선택해 주세요.</p>
                
                <!-- Buttons (JS로 동적 렌더링될 영역) -->
                <div id="place-list" class="grid grid-cols-2 gap-4">
                    <!-- 버튼들이 여기에 생성됩니다 -->
                </div>
            </div>
        </div>

        <!-- 하단모달 -->
        <div id="bottom-sheet" class="overlay">
            <div class="absolute inset-0 bg-black/50 cursor-pointer" onclick="goHome()"></div>
            
            <div class="bg-white w-full rounded-t-3xl relative z-10 p-6 pb-10 slide-up flex flex-col">
                <div class="flex justify-between items-start mb-6">
                    <div class="flex gap-3 items-center">
                        <div id="modal-icon" class="w-12 h-12 bg-orange-600 rounded-xl flex items-center justify-center text-white text-2xl">🍔</div>
                        <div>
                            <p id="modal-subtitle" class="text-blue-600 text-[11px] font-bold mb-0.5">패스트푸드 연습</p>
                            <h3 class="font-bold text-lg text-gray-900">연습 방법을 선택하세요</h3>
                        </div>
                    </div>
                    <button onclick="goHome()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 font-bold hover:bg-gray-200">✕</button>
                </div>
                
                <div class="space-y-3">
                    <button onclick="startMode('튜토리얼')" class="w-full bg-white border-[1.5px] border-gray-200 rounded-2xl p-4 flex items-center gap-4 text-left hover:border-indigo-500 transition">
                        <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-xl flex-shrink-0">📖</div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-bold text-[15px] text-gray-900">튜토리얼 모드</span>
                                <span class="text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full font-bold">처음이라면 추천</span>
                            </div>
                            <p class="text-[11px] text-gray-500">안내에 따라 한 단계씩 천천히 연습해요.</p>
                        </div>
                        <div class="text-gray-400 font-bold">›</div>
                    </button>
                    
                    <button onclick="startMode('자유연습')" class="w-full bg-white border-[1.5px] border-gray-200 rounded-2xl p-4 flex items-center gap-4 text-left hover:border-green-500 transition">
                        <div class="w-12 h-12 bg-green-600 rounded-xl flex items-center justify-center text-white text-xl flex-shrink-0">📝</div>
                        <div class="flex-1">
                            <div class="font-bold text-[15px] text-gray-900 mb-1">자유 연습 모드</div>
                            <p class="text-[11px] text-gray-500">도움 없이 내 마음대로 눌러보며 익혀요.</p>
                        </div>
                        <div class="text-gray-400 font-bold">›</div>
                    </button>
                    
                    <button onclick="startMode('미션')" class="w-full bg-white border-[1.5px] border-gray-200 rounded-2xl p-4 flex items-center gap-4 text-left hover:border-purple-500 transition">
                        <div class="w-12 h-12 bg-purple-600 rounded-xl flex items-center justify-center text-white text-xl flex-shrink-0">🎯</div>
                        <div class="flex-1">
                            <div class="font-bold text-[15px] text-gray-900 mb-1">미션 모드</div>
                            <p class="text-[11px] text-gray-500">주어진 상황을 혼자 해결해 보세요.</p>
                        </div>
                        <div class="text-gray-400 font-bold">›</div>
                    </button>
                </div>
                
                <div class="mt-6 flex items-center justify-center gap-1.5 text-gray-500 text-[11px]">
                    <span class="text-sm">ⓘ</span>
                    <span>연습 중에는 실제 결제나 접수가 되지 않아요.</span>
                </div>
            </div>
        </div>

        <!-- 스플래쉬 뷰 -->
        <div id="screen-splash" class="screen cursor-pointer" onclick="showScreen('screen-method')">
            <div class="absolute inset-0 bg-gradient-to-b from-[#FFFDF0] via-[#FFEBC3] to-[#E36630]"></div>
            <div class="relative z-10 flex flex-col items-center w-full h-full pt-16 pb-8 px-6">
                <p class="text-[#B34700] font-black text-xs tracking-wider mb-4">NEW SIGNATURE MENU</p>
                <h1 class="text-[28px] font-black text-[#3E2723] text-center leading-snug mb-12">더 크고 더 진한<br>프리미엄 버거</h1>
                
                <div class="w-56 h-56 bg-[#FFF4D9] rounded-full flex items-center justify-center mb-8 shadow-inner">
                    <div class="w-48 h-48 bg-[#FFF9E6] rounded-full flex items-center justify-center shadow-lg">
                        <div class="text-[100px]">🍔</div>
                    </div>
                </div>
                
                <h2 class="text-[22px] font-black text-[#3E2723] mb-2">더블 치즈 와퍼</h2>
                <p class="text-[#5D4037] text-sm font-medium mb-auto">풍성한 패티와 진한 치즈의 만남</p>
                
                <div class="w-full bg-[#3E2723] text-white rounded-xl py-4 flex flex-col items-center justify-center shadow-xl">
                    <span class="text-lg font-black mb-0.5">화면을 터치하세요</span>
                    <span class="text-[10px] text-gray-300">화면 어디를 눌러도 시작됩니다</span>
                </div>
            </div>
        </div>

        <!-- 매장/포장 선택 화면 (screen-method) -->
        <div id="screen-method" class="screen bg-gray-50">
            <div class="flex justify-between items-center p-4 bg-white border-b border-gray-100">
                <button onclick="goHome()" class="text-gray-500 font-bold flex items-center gap-1">
                    <span class="text-lg">‹</span> 이전
                </button>
                <h1 class="font-bold text-gray-800">와퍼 주문 연습</h1>
                <button onclick="goHome()" class="text-gray-500 font-bold text-lg px-2">✕</button>
            </div>
            
            <div class="flex flex-col flex-1 p-6">
                <h2 class="text-2xl font-black text-center mt-4 mb-2 text-gray-900">어디에서 드시나요?</h2>
                <p class="text-center text-sm text-gray-500 mb-8">원하는 주문 방법을 선택해 주세요.</p>
                
                <div class="flex gap-4 flex-1 mb-6">
                    <button onclick="selectOrderType('매장')" class="flex-1 bg-white border-[1.5px] border-gray-200 rounded-3xl flex flex-col items-center justify-center gap-4 hover:border-orange-500 hover:shadow-md transition">
                        <div class="w-16 h-16 bg-[#FFF4D9] rounded-full flex items-center justify-center font-bold text-[#B34700] text-lg shadow-sm">매장</div>
                        <span class="font-bold text-lg text-gray-900">매장식사</span>
                    </button>
                    <button onclick="selectOrderType('포장')" class="flex-1 bg-white border-[1.5px] border-gray-200 rounded-3xl flex flex-col items-center justify-center gap-4 hover:border-orange-500 hover:shadow-md transition">
                        <div class="w-16 h-16 bg-[#FFF4D9] rounded-full flex items-center justify-center font-bold text-[#B34700] text-lg shadow-sm">포장</div>
                        <span class="font-bold text-lg text-gray-900">포장주문</span>
                    </button>
                </div>
                
                <button disabled class="w-full bg-gray-200 text-gray-400 py-4 rounded-xl font-bold text-lg">확인</button>
            </div>
        </div>

    </div>

    <!-- JavaScript -->
    <script>
        // ==========================================
        // 1. 상태 관리 (State) 및 환경 변수 설정
        // ==========================================
        const BASE_URL = 'http://localhost:8000'; // 나중에 백엔드 주소로 변경하세요.
        
        // 사용자의 선택 데이터를 모아둘 객체
        let currentOrder = {
            placeId: '',      // 예: 'fastfood'
            placeName: '',    // 예: '패스트푸드'
            practiceMode: '', // 예: '자유연습'
            orderType: '',    // 예: '매장' 또는 '포장'
            items: []         // 장바구니 아이템들
        };

        // ==========================================
        // 2. API 통신 및 데이터 렌더링 로직
        // ==========================================
        async function fetchPlaces() {
            try {
                // [API 완성 후] 아래 주석을 풀고 백엔드 데이터를 받아옵니다.
                // const response = await fetch(`${BASE_URL}/api/places`);
                // return await response.json();

                // [API 완성 전] 더미 데이터 반환
                return [
                    { id: 'fastfood', name: '패스트푸드', desc: '햄버거 주문하기', icon: '🍔', bgColor: 'bg-orange-600', borderColor: 'border-orange-200' },
                    { id: 'cafe', name: '카페', desc: '커피와 음료 주문하기', icon: '☕', bgColor: 'bg-yellow-800', borderColor: 'border-gray-100' }
                ];
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                return [];
            }
        }

        async function renderPlaces() {
            const places = await fetchPlaces();
            const container = document.getElementById('place-list');
            container.innerHTML = ''; // 기존 하드코딩 내용 초기화

            places.forEach(place => {
                const btn = document.createElement('button');
                btn.className = `bg-white border-[1.5px] ${place.borderColor} rounded-2xl p-5 flex flex-col items-start hover:border-orange-500 transition shadow-sm text-left`;
                // 클릭 시 장소 객체를 통째로 넘겨 상태 저장
                btn.onclick = () => openBottomSheet(place);
                
                btn.innerHTML = `
                    <div class="w-12 h-12 ${place.bgColor} rounded-2xl flex items-center justify-center text-white text-2xl mb-4 shadow-sm">${place.icon}</div>
                    <h3 class="font-bold text-lg mb-1 text-gray-900">${place.name}</h3>
                    <p class="text-[11px] text-gray-500">${place.desc}</p>
                `;
                container.appendChild(btn);
            });
        }

        // ==========================================
        // 3. 화면 전환 및 상호작용 로직
        // ==========================================
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            const targetScreen = document.getElementById(screenId);
            if (targetScreen) targetScreen.classList.add('active');
        }

        function openBottomSheet(place) {
            // 1. 상태 업데이트
            currentOrder.placeId = place.id;
            currentOrder.placeName = place.name;
            
            // 2. 모달 내 UI 동적 업데이트 (아이콘, 텍스트 등)
            document.getElementById('modal-icon').innerText = place.icon;
            document.getElementById('modal-icon').className = `w-12 h-12 ${place.bgColor} rounded-xl flex items-center justify-center text-white text-2xl`;
            document.getElementById('modal-subtitle').innerText = `${place.name} 연습`;

            // 3. 모달 열기
            document.getElementById('bottom-sheet').classList.add('active');
        }

        function goHome() {
            document.getElementById('bottom-sheet').classList.remove('active');
            // 주문 상태 초기화
            currentOrder = { placeId: '', placeName: '', practiceMode: '', orderType: '', items: [] };
            showScreen('screen-main');
        }

        function startMode(modeName) {
            // 모드 상태 저장
            currentOrder.practiceMode = modeName;
            
            document.getElementById('bottom-sheet').classList.remove('active');
            showScreen('screen-splash'); // 스플래시 화면 띄우기
        }

        function selectOrderType(type) {
            // 매장/포장 상태 저장
            currentOrder.orderType = type;
            
            console.log('현재까지의 주문 객체 상태:', currentOrder);
            alert(`${currentOrder.placeName} - ${currentOrder.practiceMode}에서 '${type}'(을)를 선택했습니다.\n(콘솔에서 currentOrder 객체를 확인하세요!)`);
            
            // 이후 메뉴 선택 화면(새로운 screen)으로 넘어가거나 API 연동 함수를 호출하면 됩니다.
            // showScreen('screen-menu-list');
        }

        // ==========================================
        // 4. 앱 초기화 (로드 시 실행)
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            renderPlaces(); // 화면이 켜지면 더미 데이터부터 그려줌
        });
    </script>
</body>
</html>

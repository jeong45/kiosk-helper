<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>키우미 - 패스트푸드 EASY 미션</title>

  <!-- Pretendard -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <!-- 기존 패스트푸드 디자인 -->
  <link rel="stylesheet" href="../../menu&cart/fastfood.css">

  <!-- EASY 미션 전용 디자인 -->
  <link rel="stylesheet" href="easy.css">
</head>

<body>

  <div class="kiosk-container">

    <main class="page-content">

      <!-- 상단 헤더 -->
      <header class="top-header">

        <div class="logo-area">
          <div class="logo-icon-img">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <rect width="24" height="24" rx="6" fill="#DCFCE7"/>
              <path d="M12 5V15M12 15C10 13 7 13 5 15M12 15C14 13 17 13 19 15"
                stroke="#166534" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="logo-text">키우미</span>
        </div>

        <div class="store-badge-bar">
          <div class="store-title-box">
            <div class="store-red-icon" style="background-color: #ed7410;">🍔</div>
            <span class="store-main-title">패스트푸드 키오스크</span>
          </div>

          <button type="button" class="top-cart-badge"
            id="topCartBadge" onclick="goToCart()">
            장바구니 0
          </button>
        </div>

      </header>

      <!-- EASY 미션 안내창 -->
      <section class="easy-mission-banner">
        <div class="easy-mission-header">
          <span class="easy-mission-level">EASY</span>
          <span class="easy-mission-label">오늘의 미션</span>
        </div>
        <p class="easy-mission-instruction" id="missionInstruction">
          미션을 불러오는 중입니다.
        </p>
      </section>

      <!-- 상품 카테고리 -->
      <nav class="category-tabs">
        <button type="button" class="tab-btn active" data-category="와퍼">와퍼</button>
        <button type="button" class="tab-btn" data-category="사이드">사이드</button>
        <button type="button" class="tab-btn" data-category="음료">음료</button>
      </nav>

      <!-- 상품 목록 -->
      <section class="product-section">
        <div class="product-grid" id="productGrid">
          <!-- JavaScript에서 상품 카드 생성 -->
        </div>
      </section>

    </main>

    <!-- 하단 장바구니 -->
    <div class="bottom-cart-bar" id="bottomCartBar" onclick="goToCart()">
      장바구니가 비어있습니다
    </div>

    <!-- [모달 1] 단품/세트/라지세트 선택 모달 -->
    <div class="modal-overlay" id="setChoiceModal" style="display: none;">
      <div class="modal-card">
        <button type="button" class="modal-close-btn" onclick="closeSetChoiceModal()">✕</button>
        <div class="modal-sub-label">구성 선택</div>
        <h3 class="modal-item-title" id="setTitleBurgerName">치즈와퍼</h3>

        <div style="display: flex; flex-direction: column; gap: 10px; margin: 12px 0;">
          <div class="addon-item set-opt-item" id="opt-large-set" onclick="selectSetOption('large_set')">
            <div class="addon-name" id="label-large-set">라지세트</div>
            <div style="font-size:0.8rem; color:#64748b;">버거 + 라지 감자튀김 + 라지 음료</div>
            <div class="addon-price" id="price-large-set">0원</div>
          </div>
          <div class="addon-item set-opt-item" id="opt-set" onclick="selectSetOption('set')">
            <div class="addon-name" id="label-set">세트</div>
            <div style="font-size:0.8rem; color:#64748b;">버거 + 감자튀김 + 음료</div>
            <div class="addon-price" id="price-set">0원</div>
          </div>
          <div class="addon-item set-opt-item selected" id="opt-single" onclick="selectSetOption('single')">
            <div class="addon-name">단품</div>
            <div style="font-size:0.8rem; color:#64748b;">버거 단품</div>
            <div class="addon-price" id="price-single">0원</div>
          </div>
        </div>

        <button type="button" class="btn-primary full" onclick="confirmSetChoice()">선택 완료</button>
      </div>
    </div>

    <!-- [모달 2] 세트 사이드 선택 모달 -->
    <div class="modal-overlay" id="setSideModal" style="display: none;">
      <div class="modal-card">
        <button type="button" class="modal-close-btn" onclick="closeSetSideModal()">✕</button>
        <div class="modal-sub-label">세트 옵션 (1/2)</div>
        <h3 class="modal-item-title">사이드 선택</h3>

        <div class="addon-grid" id="setSideGrid"></div>

        <button type="button" class="btn-primary full" onclick="confirmSetSide()">다음 (음료 선택)</button>
      </div>
    </div>

    <!-- [모달 3] 세트 음료 선택 모달 -->
    <div class="modal-overlay" id="setDrinkModal" style="display: none;">
      <div class="modal-card">
        <button type="button" class="modal-close-btn" onclick="closeSetDrinkModal()">✕</button>
        <div class="modal-sub-label">세트 옵션 (2/2)</div>
        <h3 class="modal-item-title">음료 선택</h3>

        <div class="addon-grid" id="setDrinkGrid"></div>

        <button type="button" class="btn-primary full" onclick="confirmSetDrink()">선택 완료</button>
      </div>
    </div>

    <!-- [모달 4] 상품 수량 조절 모달 -->
    <div class="modal-overlay" id="optionModal" style="display: none;">
      <div class="modal-card">
        <button type="button" class="modal-close-btn" onclick="closeModal()">✕</button>

        <div class="modal-sub-label">상품 선택</div>
        <h3 class="modal-item-title" id="modalItemTitle">치즈와퍼</h3>
        <div class="modal-item-price" id="modalItemPrice">4100원</div>

        <div class="modal-quantity-box">
          <span class="quantity-label">수량</span>
          <div class="quantity-controls">
            <button type="button" class="qty-btn" onclick="changeQuantity(-1)">-</button>
            <span id="modalQuantity">1</span>
            <button type="button" class="qty-btn" onclick="changeQuantity(1)">+</button>
          </div>
        </div>

        <button type="button" class="btn-primary full" id="modalAddButton" onclick="addToCart()">
          장바구니 담기 · <span id="modalBtnPrice">1,000원</span>
        </button>
      </div>
    </div>

    <!-- [모달 5] 함께 하면 더 맛있는 베스트메뉴 모달 -->
    <div class="modal-overlay" id="addonModal" style="display: none;">
      <div class="modal-card">
        <button type="button" class="modal-close-btn" onclick="closeAddonModal()">✕</button>
        <div class="modal-sub-label">메뉴 추가 제안</div>
        <h3 class="modal-item-title" style="font-size: 1.3rem;">함께 하면 더 맛있는 베스트메뉴</h3>

        <div class="addon-grid" id="addonGrid"></div>

        <div class="modal-footer-btns">
          <button type="button" class="btn btn-secondary" onclick="submitAddonAndCart(false)">아니오</button>
          <button type="button" class="btn btn-primary" onclick="submitAddonAndCart(true)">추가하기</button>
        </div>
      </div>
    </div>

  </div>

  <!-- JavaScript 연결 -->
  <script src="../../menu&cart/fastfood.js"></script>
  <script src="easy.js"></script>
  <script src="../../fastfood-tutorial.js"></script>

</body>
</html>


<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>키우미 - 패스트푸드 장바구니</title>

  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <link rel="stylesheet" href="fastfood.css">
</head>
<body>

  <div class="kiosk-container">

    <header class="header">
      <div class="header-left">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/>
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/>
            <path d="M2 7h20"/>
          </svg>
        </div>

        <span class="header-title">패스트푸드 키오스크</span>
      </div>

      <div class="cart-badge">
        장바구니 <span id="header-count">0</span>
      </div>
    </header>

    <!-- 장바구니 화면 -->
    <main id="cart-view" class="view-content active">

      <div class="content-header">
        <div>
          <span class="sub-title">선택한 상품</span>
          <h2 class="main-title">장바구니</h2>
        </div>

        <button type="button" class="btn-more-menu" id="btn-more-menu">
          메뉴 더 담기
        </button>
      </div>

      <div class="item-list" id="cart-item-list"></div>

      <div class="bottom-bar">
        <div class="summary-row">
          <span class="summary-label">
            총 <span id="total-count">0</span>개 상품
          </span>

          <span class="summary-price" id="total-price">0원</span>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary" id="btn-more">
            더 담기
          </button>

          <button type="button" class="btn btn-primary" id="btn-go-order">
            주문 확인
          </button>
        </div>
      </div>

    </main>

    <!-- 주문 확인 화면 -->
    <main id="order-view" class="view-content">

      <div class="content-header">
        <div>
          <span class="sub-title">결제 전 확인</span>
          <h2 class="main-title">주문 확인</h2>
        </div>
      </div>

      <div class="item-list" id="order-item-list"></div>

      <div class="bottom-bar">
        <div class="summary-row">
          <span class="summary-label">
            총 <span id="order-total-count">0</span>개 상품
          </span>

          <span class="summary-price" id="order-total-price">0원</span>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary" id="btn-back">
            이전
          </button>

          <button type="button" class="btn btn-primary" id="btn-pay">
            결제하기
          </button>
        </div>
      </div>

    </main>

  </div>

<script src="fastfood.js"></script>
<script src="../fastfood-tutorial.js"></script>
</body>
</html>
